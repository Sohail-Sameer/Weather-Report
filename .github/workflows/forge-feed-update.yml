name: Auto-Generate Channel Updates

on:
  push:
    branches:
      - main  # Note: Change this to master if your default repository branch is named master

permissions:
  contents: write

jobs:
  build-and-update-feed:
    runs-on: ubuntu-latest

    steps:
      # 1. Pull down your repository files (even if it's currently empty)
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up the processing runtime environment
      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Create missing directories and generate the first live stream update
      - name: Build Feed Channel From Scratch
        run: |
          # Automatically create the missing target server folder if it doesn't exist
          mkdir -p channel
          
          # Install the compiler application globally on the automation container
          npm install -g feed-forge-cli || true
          
          # Check if your configuration file exists. If it is missing, create a base tracking template
          if [ ! -f "forge-config.json" ]; then
            echo '{"name": "My GitHub Commit Stream", "description": "Automatic updates repository stream"}' > forge-config.json
          fi

          # Compile the automated repository commit events into your clean stream file
          feed-forge generate --config ./forge-config.json --output ./channel/feed.xml

      # 4. Save and push the newly generated channel structure back to your browser repo
      - name: Auto-Commit New Feed Architecture
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: deployed single-channel automated feed tracker [skip ci]"
          file_pattern: 'channel/feed.xml forge-config.json'
