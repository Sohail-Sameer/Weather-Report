<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WeatherGPT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@200;300;500;600&family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Sans+Telugu:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body data-condition="clear-day">

<div class="backdrop" aria-hidden="true"><div class="backdrop-glow"></div></div>

<div class="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M6.5 18a4 4 0 1 1 .74-7.94A5.5 5.5 0 0 1 17.5 11.2 3.5 3.5 0 0 1 17 18H6.5Z"/>
        </svg>
      </span>
      <h1>WeatherGPT</h1>
    </div>
    <div class="lang-pills" role="group" aria-label="Voice language">
      <button type="button" class="lang-pill is-active" data-lang="auto">Auto</button>
      <button type="button" class="lang-pill" data-lang="en">EN</button>
      <button type="button" class="lang-pill" data-lang="hi">HI</button>
      <button type="button" class="lang-pill" data-lang="te">TE</button>
    </div>
  </header>

  <form id="ask-form" class="search-bar" autocomplete="off">
    <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="11" cy="11" r="7"/>
      <path d="m20 20-3.5-3.5"/>
    </svg>
    <label for="query-input" class="visually-hidden">Ask about the weather</label>
    <input id="query-input" type="text" placeholder="Will it rain tomorrow in Hyderabad?" />
    <button type="button" id="mic-btn" aria-label="Ask with your voice" title="Ask with your voice">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z"/>
        <path d="M19 11a7 7 0 0 1-14 0"/>
        <path d="M12 18v3"/>
      </svg>
    </button>
    <button type="submit" class="ask-btn">Ask</button>
  </form>
  <p id="status-line" class="status-line" role="status" aria-live="polite"></p>

  <section id="location-prompt" class="location-prompt hidden">
    <p>Which location should I check?</p>
    <form id="location-form" autocomplete="off">
      <input id="location-input" type="text" placeholder="City name" />
      <button type="submit">Continue</button>
    </form>
  </section>

  <section id="alert-ledger" class="alerts hidden" aria-label="Weather alerts"></section>

  <section id="result" class="result hidden">

    <div class="hero">
      <div class="hero-icon" id="hero-icon"></div>
      <div class="hero-main">
        <div class="hero-temp" id="hero-temp">—°</div>
        <div class="hero-condition" id="hero-condition">—</div>
      </div>
      <div class="hero-side">
        <p class="hero-place" id="hero-location">—</p>
        <p class="hero-sub" id="hero-updated"></p>
        <p class="hero-sub" id="hero-feelslike"></p>
        <p class="hero-sub" id="hero-hilo"></p>
      </div>
    </div>

    <div id="details-grid" class="details-grid"></div>

    <div class="forecast-wrap">
      <h3 class="section-label">7-Day Forecast</h3<h3 id="forecast-title" class="section-label">7-Day Forecast</h3>
      <div id="forecast-scroll" class="forecast-scroll"></div>
    </div>

    <div class="report-card">
      <h3 class="section-label">WeatherGPT Insights</h3>
      <div id="report-text" class="report-text"></div>
    </div>

  </section>

  <footer class="foot">
    <p>Data from Open-Meteo · Voice transcription by Groq Whisper · Reports generated by AI — verify against official warnings before making safety decisions.</p>
  </footer>

</div>

<script src="script.js"></script>
</body>
</html>
